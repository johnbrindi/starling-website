<!doctype html>
<!-- Shown right after a successful hotspot login. Sends the customer back to their access page. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected</title>
<meta http-equiv="refresh" content="2; url=https://wifi.example.cm/account">
<style>body{font-family:system-ui,Arial,sans-serif;max-width:380px;margin:40px auto;padding:0 20px;color:#16181d}a{color:#1d5bd8}</style>
</head><body>
<h1 style="font-size:20px">You are connected</h1>
<p>Welcome, $(username). Opening your access page&hellip;</p>
<p><a href="https://wifi.example.cm/account">See remaining time</a> &middot; <a href="$(link-orig)">Continue</a></p>
</body></html>
