<!doctype html>
<!--
  Starling Wi-Fi - MikroTik HotSpot login page (RouterOS v6 template variables).
  Upload to the router as hotspot/login.html in the "starling" html-directory (see docs/mikrotik-integration.md).
  It sends unauthenticated devices to the online portal, passing the router's login URL and the
  device's MAC/IP. If the portal cannot be reached, a manual code form is shown as a fallback.
  Replace PORTAL_URL below with your APP_URL (e.g. https://wifi.example.cm).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Starling Wi-Fi</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#16181d;background:#fff}
  .w{max-width:380px;margin:0 auto;padding:32px 20px}
  h1{font-size:20px;margin:0 0 6px}p{color:#6b7180;font-size:14px;line-height:1.5}
  a.b,button{display:block;width:100%;box-sizing:border-box;height:46px;border:0;border-radius:6px;background:#1d5bd8;color:#fff;font-size:16px;font-weight:600;text-align:center;line-height:46px;text-decoration:none}
  input{width:100%;box-sizing:border-box;height:46px;border:1px solid #e3e6ec;border-radius:6px;padding:0 12px;font-size:18px;letter-spacing:2px;text-transform:uppercase;margin:8px 0 12px}
  .err{background:#fdecea;color:#b42318;padding:10px 12px;border-radius:6px;font-size:14px}
  .muted{font-size:12px;color:#6b7180;margin-top:20px}
</style>
</head>
<body>
<div class="w">
  <h1>Starling Wi-Fi</h1>
  $(if error)<p class="err">$(error)</p>$(endif)
  <p id="msg">Opening the Wi-Fi portal&hellip;</p>
  <p><a class="b" id="go" href="#">Buy a pass / My access</a></p>

  <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="false">
    <input type="hidden" name="password" value="">
    <p style="margin-top:28px">Already have an access code?</p>
    <input name="username" autocomplete="off" autocapitalize="characters" placeholder="ABCD-EFGH" aria-label="Access code">
    <button type="submit">Connect</button>
  </form>
  <p class="muted">Need help? Ask at the counter.</p>
</div>
<script>
  var PORTAL_URL = "https://wifi.example.cm"; // <-- set to your APP_URL
  function q(v){return encodeURIComponent(v)}
  var target = PORTAL_URL + "/portal?login=" + q("$(link-login-only)") + "&mac=" + q("$(mac)") + "&ip=" + q("$(ip)") +
    "&dst=" + q("$(link-orig)") + ("$(error)" ? "&error=" + q("$(error)") : "");
  document.getElementById("go").href = target;
  // Errors (wrong/expired code) are shown on the portal too; without an error, go straight there.
  setTimeout(function(){ window.location.replace(target); }, "$(error)" ? 2500 : 200);
  function doLogin(){
    var f = document.login, code = f.username.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    f.username.value = code; f.password.value = code; // the access code is both username and password
    return true;
  }
</script>
</body>
</html>
