# FreeRADIUS 3.x  /etc/freeradius/3.0/mods-available/sql  (relevant parts). Enable with:
#   ln -s ../mods-available/sql /etc/freeradius/3.0/mods-enabled/sql
sql {
    dialect = "postgresql"
    driver = "rlm_sql_${dialect}"
    server = "db.example.internal"      # Postgres host reachable from the RADIUS server
    port = 5432
    login = "freeradius"
    password = "CHANGE-ME"
    radius_db = "dbname=postgres sslmode=require options='-c search_path=radius'"
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    authreply_table = "radreply"
    groupcheck_table = "radgroupcheck"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"
    read_groups = no
    read_clients = no
    pool { start = 2  min = 2  max = 10  spare = 3  uses = 0  lifetime = 0  idle_timeout = 60 }
    $INCLUDE ${modconfdir}/${.:name}/main/${dialect}/queries.conf
}
